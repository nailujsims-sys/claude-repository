name: Deploy Mind Whiteboard to GitHub Pages

# Tests, builds and publishes the app to GitHub Pages, then verifies that the
# live URL really serves the commit this run just built.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
#
# REQUIRED one-time setup: the two public Supabase values, as repository
# variables (Settings → Secrets and variables → Actions → Variables) or as
# secrets — VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY. Both are public: the
# URL names the project, the anon key is the browser's identity before login,
# and every row behind them is guarded by Row Level Security. The service-role
# key and the database password must never appear here.
#
# Without them the build stops (see "Check the Supabase configuration"). That
# is on purpose: a build without a backend produces an app that cannot store
# anything, and shipping it silently is what this whole setup replaced.
# Details: supabase/README.md

on:
  # Only the default branch. The `github-pages` environment refuses deployments
  # from any other branch, so listing feature branches here produced a failing
  # run on every feature push — noise that made real failures easy to miss.
  push:
    branches: [main, master, "claude/zen-mayer-bKTbe"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Deployments queue instead of cancelling: cancelling one mid-publish can
  # leave the site on a half-updated state, and every commit deserves to land.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the deployment on the same checks a contributor runs locally, so
      # "deployed" means "passed", not just "compiled".
      - name: Logic tests
        run: npm run test:logic

      - name: Smoke test
        run: npm run smoke

      # Fail before the build rather than after the deploy: an app without a
      # database is not a degraded app, it is a different one.
      - name: Check the Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${VITE_SUPABASE_URL:-}" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing Supabase configuration:$missing — set it under Settings → Secrets and variables → Actions (variable or secret). See supabase/README.md"
            exit 1
          fi
          # The URL is not secret, so printing it makes the run self-documenting;
          # the key is only ever confirmed as present.
          echo "Supabase project: $VITE_SUPABASE_URL"
          echo "Anon key: present (${#VITE_SUPABASE_ANON_KEY} characters)"

      - name: Build
        env:
          # vite.config.js stamps this into the bundle and into version.json.
          GITHUB_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Check the build stamped the right commit
        run: |
          set -euo pipefail
          echo "dist/version.json:"
          cat dist/version.json
          built=$(node -p "require('./dist/version.json').commit")
          if [ "$built" != "${{ github.sha }}" ]; then
            echo "::error::Build stamped $built, expected ${{ github.sha }}"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # The deploy step reporting success only means GitHub accepted the
      # artifact. This asks the public URL what it is actually serving, and
      # fails the run if it is not this commit — so a green run is proof the
      # live site is current. Pages needs a moment to propagate, hence retries.
      - name: Verify the live URL serves this commit
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}version.json"
          echo "Polling $url"
          for attempt in $(seq 1 12); do
            live=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$url" \
                   | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).commit" 2>/dev/null || echo "")
            if [ "$live" = "${{ github.sha }}" ]; then
              echo "OK — live site serves ${{ github.sha }} (attempt $attempt)"
              curl -fsSL "$url"
              exit 0
            fi
            echo "attempt $attempt: live=${live:-<unreachable>} expected=${{ github.sha }}"
            sleep 10
          done
          echo "::error::Live URL did not serve ${{ github.sha }} within ~2 minutes"
          exit 1
