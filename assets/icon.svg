<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243f"/>
      <stop offset="0.55" stop-color="#0c1322"/>
      <stop offset="1" stop-color="#16352a"/>
    </linearGradient>
    <radialGradient id="striker" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff7a7e"/>
      <stop offset="1" stop-color="#c81d25"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle table line -->
  <line x1="56" y1="256" x2="456" y2="256" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6" stroke-dasharray="22 18"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>

  <!-- watermelon wedge (flat side up) -->
  <g transform="translate(236 300)">
    <path d="M -186 0 A 186 186 0 0 0 186 0 Z" fill="#2e7d32"/>
    <path d="M -172 0 A 172 172 0 0 0 172 0 Z" fill="#66bb6a"/>
    <path d="M -158 0 A 158 158 0 0 0 158 0 Z" fill="#f4fff4"/>
    <path d="M -146 0 A 146 146 0 0 0 146 0 Z" fill="#ff5a6a"/>
    <g fill="#241016">
      <ellipse cx="-70" cy="60" rx="9" ry="15" transform="rotate(18 -70 60)"/>
      <ellipse cx="0" cy="86" rx="9" ry="15"/>
      <ellipse cx="70" cy="60" rx="9" ry="15" transform="rotate(-18 70 60)"/>
      <ellipse cx="-34" cy="38" rx="8" ry="13" transform="rotate(8 -34 38)"/>
      <ellipse cx="38" cy="38" rx="8" ry="13" transform="rotate(-8 38 38)"/>
    </g>
  </g>

  <!-- hockey striker -->
  <g transform="translate(372 150)">
    <ellipse cx="6" cy="14" rx="60" ry="40" fill="#000" opacity="0.28"/>
    <circle cx="0" cy="0" r="62" fill="#7a0e14"/>
    <circle cx="0" cy="0" r="54" fill="url(#striker)"/>
    <circle cx="0" cy="0" r="24" fill="#ffe9ea"/>
    <ellipse cx="-16" cy="-18" rx="16" ry="9" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
