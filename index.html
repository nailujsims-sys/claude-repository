<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080C14" />
    <meta name="description" content="Mind Whiteboard — persönliche Produktivität für Julian." />
    <title>Mind Whiteboard</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Clean up any leftover service worker from the previous app (Fruit
         Hockey PWA). Mind Whiteboard registers none; this just self-heals
         returning browsers. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          if (regs.length) {
            Promise.all(regs.map((r) => r.unregister())).then(() => {
              if (window.caches && caches.keys) {
                caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)))
              }
            })
          }
        }).catch(() => {})
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
